name: Website build

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths: ['src/**', 'public/**', 'catalog/**', 'config/**', 'scripts/**', 'tests/**', 'astro.config.*', 'tsconfig.json', 'package*.json', '.github/workflows/site.yml']
  pull_request:
    paths: ['src/**', 'public/**', 'catalog/**', 'config/**', 'scripts/**', 'tests/**', 'astro.config.*', 'tsconfig.json', 'package*.json', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, tests and static build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:site
