name: Website quality

on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'catalog/**', 'config/**', 'scripts/**', 'astro.config.*', 'package*.json', '.github/workflows/quality.yml']
  # Required check on main: run for every pull request so it always reports.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Mobile Lighthouse (home and Nevermore)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:site
      - name: Measure actual mobile quality
        run: node scripts/measure-quality.mjs
      - name: Preserve measured reports, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lighthouse-${{ github.sha }}
          path: reports/lighthouse/
          if-no-files-found: warn
          retention-days: 14
