name: Nevermore source checks

on:
  push:
    paths:
      - 'experiences/nevermore/app/**'
      - 'experiences/nevermore/export-manifest.json'
      - 'experiences/nevermore/verify_export.py'
      - '.github/workflows/nevermore-source.yml'
      - '.gitattributes'
  # Required check on main: run for every pull request so it always reports.
  pull_request:

permissions:
  contents: read

jobs:
  source-only:
    name: Source integrity + logic tests (not device/media)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Verify curated source integrity
        run: python experiences/nevermore/verify_export.py
      - name: Test experience logic only
        working-directory: experiences/nevermore/app
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_audio.py tests/test_director.py tests/test_events.py tests/test_scheduler.py
