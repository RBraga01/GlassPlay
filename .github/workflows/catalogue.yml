name: Catalogue consistency

on:
  push:
    paths: ['catalog/**', 'config/**', 'experiences/**/export-manifest.json', 'experiences/**/release-manifest.json', 'scripts/check-catalogue.*', 'scripts/catalogue*', 'package*.json', '.github/workflows/catalogue.yml']
  # Required check on main: run for every pull request so it always reports.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:catalogue
