name: Publish approved website

on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'catalog/**', 'config/**', 'scripts/**', 'tests/**', 'astro.config.*', 'package*.json', '.github/workflows/pages.yml']
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: 'Publish the owner-approved website publicly from main'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Check publication approval and build
    if: >-
      vars.PAGES_PUBLICATION_APPROVED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.confirm_publication == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require an existing protected deployment environment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const get = async (path) => {
            const response = await fetch(`https://api.github.com/repos/${process.env.GH_REPOSITORY}/${path}`, {
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
            });
            if (!response.ok) throw new Error(`Cannot verify deployment protection (${response.status}); owner setup is required.`);
            return response.json();
          };
          const environment = await get('environments/github-pages');
          const main = await get('branches/main');
          if (!main.protected) throw new Error('main must be protected before publication is enabled.');
          const policy = environment.deployment_branch_policy;
          if (policy?.custom_branch_policies) {
            const { branch_policies, total_count } = await get('environments/github-pages/deployment-branch-policies');
            if (total_count !== 1 || branch_policies.length !== 1 || branch_policies.some(rule => rule.name !== 'main' || (rule.type ?? 'branch') !== 'branch')) {
              throw new Error('The github-pages environment must allow only the main branch.');
            }
          } else if (!policy?.protected_branches) {
            throw new Error('The github-pages environment must restrict deployment branches.');
          }
          console.log('Verified existing environment and protected main branch.');
          NODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:catalogue
      - name: Build the public asset tree
        run: npm run build
      - run: npm run check:site
      - name: Enforce committed publication decisions and asset allowlist
        run: npm run check:publication
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
          retention-days: 1

  deploy:
    name: Publish after environment approval
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # Owner setup is verified by the build job. Add required reviewers where the
    # account plan supports them; private personal Pro has branch restrictions.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved static artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
